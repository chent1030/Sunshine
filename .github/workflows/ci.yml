---
# CATL投屏 专用 CI：只构建 macOS 与 Windows 两个平台，打 tag（v*）时自动发布 Release。
name: CI
permissions: {}

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  meta:
    name: Build metadata
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=0.0.0-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          fi

  build-macos:
    name: macOS
    needs: meta
    permissions:
      contents: read
    uses: ./.github/workflows/ci-macos.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: ${{ needs.meta.outputs.version }}
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: >-
        ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD: >-
        ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}

  build-windows:
    name: Windows
    needs: meta
    permissions:
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: ${{ needs.meta.outputs.version }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - meta
      - build-macos
      - build-windows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          CATL投屏 电脑端（Sunshine 定制版）

          ## 下载

          | 文件 | 适用 |
          | --- | --- |
          | `Sunshine-macOS-arm64.dmg` | Apple 芯片 Mac（M 系列） |
          | `Sunshine-macOS-x86_64.dmg` | Intel Mac |
          | `Sunshine-Windows-AMD64-installer.msi` | Windows x64 安装包 |
          | `Sunshine-Windows-AMD64-lite.zip` | Windows x64 免安装版 |
          | `Sunshine-Windows-ARM64-installer.msi` / `-lite.zip` | Windows ARM64 |

          ## 安装后

          1. 启动 CATL投屏，首次运行按提示授予「屏幕录制」「辅助功能」「本地网络」权限。
          2. 电视端打开 CATL投屏 App，会自动发现这台电脑。
          3. 点电脑卡片即可直接投屏，无需再选应用。

          ## 说明

          - macOS 包未做 Apple 公证，首次打开需右键 →「打开」，或执行 `xattr -cr /Applications/Sunshine.app`。
          - Web 管理界面：`https://localhost:47990`
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CATL投屏 ${TAG}" \
            --notes-file release-notes.md \
            --verify-tag \
            artifacts/*
